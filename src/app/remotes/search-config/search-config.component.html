<div
  class="flex justify-content-end align-items-center"
  *ocxIfPermission="'SEARCHCONFIG#VIEW'; permissions: permissions"
>
  @if (vm$ | async; as vm) {
    <p-inputgroup class="sc-search-config-group">
      <p-floatlabel variant="on">
        <p-select
          class="sc-search-config-select"
          [ngModel]="vm.currentConfig"
          (ngModelChange)="onSearchConfigChange($event)"
          [options]="vm.searchConfigs"
          optionLabel="name"
          [filter]="true"
          [filterPlaceholder]="'SEARCH_CONFIG.SELECT.FILTER_PLACEHOLDER' | translate"
          [emptyFilterMessage]="'SEARCH_CONFIG.SELECT.NO_MATCH' | translate"
          [panelStyleClass]="'sc-search-config-panel'"
          [appendTo]="overlayAppendTo"
          [disabled]="vm.searchConfigs.length === 0"
          [ariaLabel]="'SEARCH_CONFIG.SELECT.ARIA_LABEL' | translate"
        >
          <ng-template #item let-config>
            <div class="sc-search-config-row">
              <span
                class="sc-search-config-row-name"
                [pTooltip]="config.name"
                [showOnEllipsis]="true"
                [appendTo]="overlayAppendTo"
                >{{ config.name }}</span
              >
              @if (canDelete(config)) {
                <p-button
                  class="sc-search-config-delete"
                  icon="{{ deleteIcon }}"
                  [text]="true"
                  [ariaLabel]="'SEARCH_CONFIG.DELETE.ARIA_LABEL' | translate"
                  (click)="onSearchConfigDelete(config); $event.stopPropagation()"
                ></p-button>
              }
            </div>
          </ng-template>
        </p-select>
        <label class="sc-search-config-label">
          {{
            (vm.searchConfigs.length === 0 ? 'SEARCH_CONFIG.SELECT.NO_CONFIGS_LABEL' : 'SEARCH_CONFIG.SELECT.LABEL')
              | translate
          }}
        </label>
      </p-floatlabel>
      <p-button
        id="sc_search_config_save_as"
        class="sc-search-config-save-as"
        [label]="'SEARCH_CONFIG.SAVE_AS.LABEL' | translate"
        [icon]="saveAsIcon"
        severity="primary"
        [ariaLabel]="'SEARCH_CONFIG.SAVE_AS.ARIA_LABEL' | translate"
        (onClick)="onSearchConfigSave(vm)"
      ></p-button>
    </p-inputgroup>
  }
</div>
