<div
  class="flex justify-content-end align-items-center"
  *ocxIfPermission="'SEARCHCONFIG#VIEW'; permissions: permissions"
>
  @if (vm$ | async; as vm) {
    <p-inputgroup class="sc-search-config-group">
      <p-floatlabel variant="on">
        <p-select
          class="sc-search-config-select"
          dataKey="id"
          [ngModel]="vm.currentConfig"
          (ngModelChange)="onSearchConfigChange($event)"
          [options]="vm.searchConfigs"
          optionLabel="name"
          [filter]="true"
          [filterPlaceholder]="'SEARCH_CONFIG.SELECT.FILTER_PLACEHOLDER' | translate"
          [emptyFilterMessage]="'SEARCH_CONFIG.SELECT.NO_MATCH' | translate"
          panelStyleClass="sc-search-config-panel"
          scrollHeight="var(--onecx-search-config-panel-max-height)"
          inputId="sc_search_config_select"
          [disabled]="vm.searchConfigs.length === 0 || vm.editMode"
          (keydown)="onSearchConfigSelectKeydown($event)"
          [ariaLabelledBy]="'sc_search_config_label'"
          [pt]="
            hasDeletableConfig(vm.searchConfigs)
              ? { label: { 'aria-describedby': 'sc_search_config_delete_hint' } }
              : undefined
          "
        >
          <ng-template #item let-config>
            <div class="sc-search-config-row">
              <span class="sc-search-config-row-name" [pTooltip]="config.name" [showOnEllipsis]="true">{{
                config.name
              }}</span>
              @if (canDelete(config)) {
                <p-button
                  class="sc-search-config-delete"
                  [icon]="deleteIcon"
                  [text]="true"
                  severity="danger"
                  [tabindex]="-1"
                  aria-hidden="true"
                  (click)="onSearchConfigDelete(config); $event.stopPropagation()"
                ></p-button>
              }
            </div>
          </ng-template>
        </p-select>
        <label class="sc-search-config-label" id="sc_search_config_label" for="sc_search_config_select">
          {{
            (vm.searchConfigs.length === 0 ? 'SEARCH_CONFIG.SELECT.NO_CONFIGS_LABEL' : 'SEARCH_CONFIG.SELECT.LABEL')
              | translate
          }}
        </label>
        @if (hasDeletableConfig(vm.searchConfigs)) {
          <span id="sc_search_config_delete_hint" class="p-hidden-accessible">
            {{ 'SEARCH_CONFIG.DELETE.DELETE_KEY_HINT' | translate }}
          </span>
        }
      </p-floatlabel>
      <p-inputgroup-addon
        class="sc-search-config-save-as"
        *ocxIfPermission="'SEARCHCONFIG#CREATE'; permissions: permissions"
      >
        <p-button
          [id]="saveAsButtonId"
          [label]="'SEARCH_CONFIG.SAVE_AS.LABEL' | translate"
          [icon]="saveAsIcon"
          [disabled]="vm.editMode"
          [ariaLabel]="'SEARCH_CONFIG.SAVE_AS.ARIA_LABEL' | translate"
          (onClick)="onSearchConfigSave(vm)"
        ></p-button>
      </p-inputgroup-addon>
    </p-inputgroup>
  }
</div>
